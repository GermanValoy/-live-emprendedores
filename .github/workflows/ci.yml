name: CI

on:
  push:
    branches: [main, fase-0]
  pull_request:

# El token de GitHub de este flujo solo puede leer el repositorio.
permissions:
  contents: read

# Si llegan dos cambios seguidos a la misma rama o PR, se cancela la corrida vieja:
# así no corren dos juegos de pruebas a la vez sobre la misma base de datos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    # SUPABASE_SECRET_KEY va solo en los pasos que la usan, nunca en la instalación ni el armado.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de tipos
        run: npm run typecheck
      - name: Revisión de estilo
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Pruebas de integración con Supabase
        run: npm run test:integracion
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Armado de la app
        run: npm run build
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npm run test:e2e
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: test-results/
          retention-days: 7
